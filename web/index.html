<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stall Radar</title>
<meta name="description" content="Which ARPA pandemic relief dollars will go unspent by the Dec 31, 2026 deadline? A model trained on four years of Treasury reports scores every open project.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 26 26%22%3E%3Ccircle cx=%2213%22 cy=%2213%22 r=%2211%22 fill=%22none%22 stroke=%22%232a78d6%22 stroke-width=%223%22/%3E%3Ccircle cx=%2218.6%22 cy=%228.6%22 r=%223.5%22 fill=%22%23e34948%22/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme:light;
  --bg:#f6f5f2; --surface:#fcfcfb; --surface-2:#efeee9; --line:#dedcd5;
  --text:#0b0b0b; --text-2:#52514e; --muted:#7a7873;
  --accent:#2a78d6; --accent-ink:#1c5cab; --accent-soft:#cde2fb;
  --risk:#e34948; --risk-soft:#f9d9d8; --warn:#eda100; --ok:#008300;
  --bar:#2a78d6; --bar-2:#86b6ef;
  --radius:10px;
}
@media (prefers-color-scheme: dark){
  :root:where(:not([data-theme="light"])){
    color-scheme:dark;
    --bg:#121211; --surface:#1a1a19; --surface-2:#232321; --line:#33322f;
    --text:#f0efec; --text-2:#c3c2b7; --muted:#8f8d86;
    --accent:#3987e5; --accent-ink:#86b6ef; --accent-soft:#16365c;
    --risk:#e66767; --risk-soft:#3a1d1d; --warn:#c98500; --ok:#3aa63a;
    --bar:#3987e5; --bar-2:#1c5cab;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#121211; --surface:#1a1a19; --surface-2:#232321; --line:#33322f;
  --text:#f0efec; --text-2:#c3c2b7; --muted:#8f8d86;
  --accent:#3987e5; --accent-ink:#86b6ef; --accent-soft:#16365c;
  --risk:#e66767; --risk-soft:#3a1d1d; --warn:#c98500; --ok:#3aa63a;
  --bar:#3987e5; --bar-2:#1c5cab;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font:15px/1.5 Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
a{color:var(--accent-ink)}
.mono{font-family:"IBM Plex Mono",ui-monospace,monospace}
.wrap{max-width:1120px;margin:0 auto;padding:0 16px}
header.top{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
header.top .wrap{display:flex;align-items:center;gap:18px;height:56px}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;letter-spacing:-.01em;text-decoration:none;color:var(--text)}
.brand svg{flex:none}
nav{display:flex;gap:4px;margin-left:auto}
nav a{padding:6px 10px;border-radius:8px;text-decoration:none;color:var(--text-2);font-weight:500;font-size:14px}
nav a.on,nav a:hover{background:var(--surface-2);color:var(--text)}
.theme{border:1px solid var(--line);background:var(--surface);color:var(--text-2);border-radius:8px;height:32px;width:32px;cursor:pointer}
main{padding:28px 0 64px}
.eyebrow{font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
h1{font-size:clamp(28px,4.6vw,44px);line-height:1.08;letter-spacing:-.025em;margin:.25em 0 .35em;max-width:20ch}
h2{font-size:20px;letter-spacing:-.01em;margin:0 0 4px}
h3{font-size:15px;margin:0 0 6px}
p.lede{font-size:17px;color:var(--text-2);max-width:62ch;margin:0}
.grid{display:grid;gap:16px}
.g3{grid-template-columns:repeat(3,1fr)}
.g2{grid-template-columns:1fr 1fr}
@media (max-width:820px){.g3,.g2{grid-template-columns:1fr}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:18px}
.stat .v{font-size:34px;font-weight:700;letter-spacing:-.02em;line-height:1.1}
.stat .v.risk{color:var(--risk)}
.stat .l{color:var(--text-2);font-size:14px;margin-top:4px}
.stat .s{color:var(--muted);font-size:12.5px;margin-top:8px}
section{margin-top:28px}
.sub{color:var(--text-2);font-size:14px;margin:0 0 14px}
.search{position:relative;margin-top:22px;max-width:640px}
.search input{width:100%;height:50px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--text);font:inherit;font-size:16px;padding:0 16px 0 44px;outline:none}
.search input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.search svg{position:absolute;left:14px;top:15px;color:var(--muted)}
.sugg{position:absolute;left:0;right:0;top:54px;background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden;box-shadow:0 12px 28px rgba(0,0,0,.12);z-index:4;display:none}
.sugg a{display:flex;justify-content:space-between;gap:12px;padding:10px 14px;text-decoration:none;color:var(--text);border-top:1px solid var(--line)}
.sugg a:first-child{border-top:0}
.sugg a:hover,.sugg a.sel{background:var(--surface-2)}
.sugg small{color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.chip{font-size:12.5px;padding:4px 10px;border-radius:999px;background:var(--surface-2);color:var(--text-2);text-decoration:none;border:1px solid var(--line)}
.chip:hover{color:var(--text)}
table{width:100%;border-collapse:collapse;font-size:14px}
th{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);text-align:left;font-weight:600;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:10px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.tbl{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius)}
.pname{font-weight:600}
.pmeta{color:var(--muted);font-size:12.5px;margin-top:2px}
.why{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.why span{font-size:11.5px;padding:2px 7px;border-radius:6px;background:var(--risk-soft);color:var(--text)}
.meter{display:flex;align-items:center;gap:8px;justify-content:flex-end}
.meter .b{width:56px;height:6px;border-radius:3px;background:var(--surface-2);overflow:hidden}
.meter .b i{display:block;height:100%;background:var(--risk);border-radius:3px}
details summary{cursor:pointer;color:var(--accent-ink);font-size:12.5px;margin-top:6px}
details p{color:var(--text-2);font-size:13px;margin:6px 0 0;max-width:70ch}
.btn{display:inline-flex;align-items:center;gap:8px;height:38px;padding:0 14px;border-radius:9px;border:1px solid var(--line);background:var(--surface);color:var(--text);font:inherit;font-weight:600;font-size:14px;cursor:pointer;text-decoration:none}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.row{display:flex;flex-wrap:wrap;align-items:center;gap:10px}
.spacer{flex:1}
.chart{position:relative}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.chart .tt{position:absolute;pointer-events:none;background:var(--text);color:var(--bg);font-size:12.5px;padding:6px 9px;border-radius:7px;white-space:nowrap;opacity:0;transition:opacity .08s;transform:translate(-50%,-110%)}
.axis text{fill:var(--muted);font-size:11px}
.lbl{fill:var(--text-2);font-size:12px}
.val{fill:var(--text);font-size:12px;font-variant-numeric:tabular-nums}
.grid line{stroke:var(--line)}
.note{font-size:13px;color:var(--muted)}
.callout{border-left:3px solid var(--warn);background:var(--surface);padding:12px 14px;border-radius:0 8px 8px 0;color:var(--text-2);font-size:14px}
.method p,.method li{color:var(--text-2);max-width:74ch}
.method h2{margin-top:30px}
.kbd{font-family:"IBM Plex Mono",monospace;font-size:12.5px;background:var(--surface-2);padding:1px 5px;border-radius:5px}
.best td{font-weight:600}
footer{border-top:1px solid var(--line);padding:22px 0;color:var(--muted);font-size:13px}
.loading{color:var(--muted);padding:40px 0}
.pill{display:inline-block;font-size:12px;padding:2px 8px;border-radius:6px;background:var(--surface-2);color:var(--text-2)}
@media (max-width:640px){.tbl.proj th:nth-child(2),.tbl.proj td:nth-child(2),.tbl.proj th:nth-child(3),.tbl.proj td:nth-child(3){display:none}nav a{padding:6px 6px;font-size:13px}}
.legend{display:flex;gap:14px;font-size:12.5px;color:var(--text-2);margin-bottom:6px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:-1px}
</style>
</head>
<body>
<header class="top"><div class="wrap">
  <a class="brand" href="#/"><svg width="26" height="26" viewBox="0 0 26 26" aria-hidden="true"><circle cx="13" cy="13" r="11.5" fill="none" stroke="currentColor" stroke-width="1.5" opacity=".35"/><circle cx="13" cy="13" r="6.5" fill="none" stroke="currentColor" stroke-width="1.5" opacity=".6"/><path d="M13 13 L22 6" stroke="var(--risk)" stroke-width="2" stroke-linecap="round"/><circle cx="18.6" cy="8.6" r="2.2" fill="var(--risk)"/></svg>Stall Radar</a>
  <nav><a href="#/" data-r="home">Overview</a><a href="#/method" data-r="method">Method &amp; validation</a><a href="#/data" data-r="data">Data</a></nav>
  <button class="theme" id="theme" title="Toggle theme" aria-label="Toggle theme">&#9680;</button>
</div></header>
<main><div class="wrap" id="app"><div class="loading">Loading the open book...</div></div></main>
<footer><div class="wrap">Stall Radar. Built from U.S. Treasury SLFRF Project and Expenditure public data (seven snapshots, Mar 2023 to Mar 2026). Forecasts are estimates for planning, not findings of non-compliance. MIT licensed. <a href="https://github.com/Mattbusel/stall-radar">Source</a>.</div></footer>
<script>
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const usd = v => { const a = Math.abs(v); if (a >= 1e9) return "$" + (v/1e9).toFixed(a >= 1e10 ? 1 : 2) + "B"; if (a >= 1e6) return "$" + (v/1e6).toFixed(a >= 1e8 ? 0 : 1) + "M"; if (a >= 1e3) return "$" + Math.round(v/1e3) + "K"; return "$" + Math.round(v); };
const usdFull = v => "$" + Math.round(v).toLocaleString("en-US");
const pct = v => Math.round(v * 100) + "%";
const slug = s => String(s).toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "");
let NAT = null, REC = null; const STATES = {};

// theme toggle (remembered per viewer; page works without storage)
(function(){ let t = null; try { t = localStorage.getItem("sr-theme"); } catch(e){}
  if (t) document.documentElement.dataset.theme = t;
  $("#theme").onclick = () => { const cur = document.documentElement.dataset.theme || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
    const nx = cur === "dark" ? "light" : "dark"; document.documentElement.dataset.theme = nx; try { localStorage.setItem("sr-theme", nx); } catch(e){} };
})();

async function getJSON(u){ const r = await fetch(u); if (!r.ok) throw new Error(u + " " + r.status); return r.json(); }
async function state(sl){ return STATES[sl] ||= await getJSON("data/states/" + sl + ".json"); }

// ---------- charts (single-series horizontal bars, hover tooltip) ----------
function hbar(el, rows, {label, value, fmt = usd, sub, href, max}){
  const W = 640, rh = 26, padL = 196, padR = 70, H = rows.length * rh + 6;
  const mx = max ?? Math.max(...rows.map(value));
  let s = `<svg viewBox="0 0 ${W} ${H}" role="img">`;
  rows.forEach((r, i) => {
    const y = i * rh + 4, w = Math.max(2, (W - padL - padR) * value(r) / mx);
    const lab = label(r); const short = lab.length > 29 ? lab.slice(0, 28) + "…" : lab;
    s += `<g class="hb" data-i="${i}" style="cursor:${href ? "pointer" : "default"}">
      <rect x="0" y="${y - 2}" width="${W}" height="${rh}" fill="transparent"/>
      <text class="lbl" x="${padL - 10}" y="${y + 13}" text-anchor="end">${esc(short)}</text>
      <rect x="${padL}" y="${y + 3}" width="${w}" height="${rh - 12}" rx="4" fill="var(--bar)"/>
      <text class="val" x="${padL + w + 6}" y="${y + 13}">${fmt(value(r))}</text></g>`;
  });
  s += `</svg><div class="tt"></div>`;
  el.innerHTML = s; el.classList.add("chart");
  const tt = $(".tt", el);
  el.querySelectorAll(".hb").forEach(g => {
    const r = rows[+g.dataset.i];
    g.onmousemove = e => { const b = el.getBoundingClientRect(); tt.style.left = (e.clientX - b.left) + "px"; tt.style.top = (e.clientY - b.top) + "px"; tt.style.opacity = 1; tt.innerHTML = `<b>${esc(label(r))}</b><br>${sub ? sub(r) : fmt(value(r))}`; };
    g.onmouseleave = () => tt.style.opacity = 0;
    if (href) g.onclick = () => location.hash = href(r);
  });
}

function calibChart(el, pts){
  const W = 420, H = 300, L = 46, B = 36, T = 10, R = 12;
  const x = v => L + v * (W - L - R), y = v => H - B - v * (H - B - T);
  let s = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Calibration: predicted versus actual closure share by decile"><g class="grid axis">`;
  for (let t = 0; t <= 1.001; t += .25) s += `<line x1="${x(0)}" x2="${x(1)}" y1="${y(t)}" y2="${y(t)}"/><text x="${L - 8}" y="${y(t) + 4}" text-anchor="end">${pct(t)}</text><text x="${x(t)}" y="${H - B + 18}" text-anchor="middle">${pct(t)}</text>`;
  s += `</g><line x1="${x(0)}" y1="${y(0)}" x2="${x(1)}" y2="${y(1)}" stroke="var(--muted)" stroke-dasharray="4 4"/>`;
  s += `<polyline fill="none" stroke="var(--bar)" stroke-width="2" points="${pts.map(p => x(p.pred) + "," + y(p.actual)).join(" ")}"/>`;
  pts.forEach((p, i) => s += `<circle class="cp" data-i="${i}" cx="${x(p.pred)}" cy="${y(p.actual)}" r="5" fill="var(--bar)" stroke="var(--surface)" stroke-width="2"/><circle class="hit" data-i="${i}" cx="${x(p.pred)}" cy="${y(p.actual)}" r="14" fill="transparent"/>`);
  s += `<text class="lbl" x="${(L + W - R) / 2}" y="${H - 2}" text-anchor="middle">Predicted share of open balance spent in 12 months</text>`;
  s += `<text class="lbl" transform="translate(11 ${(H - B) / 2}) rotate(-90)" text-anchor="middle">Actual share spent</text></svg><div class="tt"></div>`;
  el.innerHTML = s; el.classList.add("chart");
  const tt = $(".tt", el);
  el.querySelectorAll(".hit").forEach(c => { const p = pts[+c.dataset.i];
    c.onmousemove = e => { const b = el.getBoundingClientRect(); tt.style.left = (e.clientX - b.left) + "px"; tt.style.top = (e.clientY - b.top) + "px"; tt.style.opacity = 1; tt.innerHTML = `Decile ${p.dec + 1}: predicted ${pct(p.pred)}, actual ${pct(p.actual)}<br>${p.n.toLocaleString()} projects`; };
    c.onmouseleave = () => tt.style.opacity = 0; });
}

// ---------- shared pieces ----------
function projectRows(list, showGov){
  return list.map(p => `<tr>
    <td><div class="pname">${esc(p.n)}</div>
      <div class="pmeta">${showGov ? `<a href="#/r/${esc(p.rid)}">${esc(govName(p.rid))}</a> &middot; ` : ""}${esc(p.ec)} &middot; ${esc(p.status)}</div>
      ${p.why?.length ? `<div class="why">${p.why.map(w => `<span>${esc(w)}</span>`).join("")}</div>` : ""}
      ${p.d ? `<details><summary>Project description</summary><p>${esc(p.d)}</p></details>` : ""}</td>
    <td class="num">${usd(p.obl)}</td><td class="num">${usd(p.gap)}</td>
    <td class="num"><div class="meter"><span>${pct(p.p)}</span><span class="b"><i style="width:${Math.round(p.p * 100)}%"></i></span></div></td>
    <td class="num"><b>${usd(p.risk)}</b></td></tr>`).join("");
}
const projHead = `<thead><tr><th>Project</th><th class="num">Budget</th><th class="num">Unspent now</th><th class="num">Stall risk</th><th class="num">Projected unspent Dec 31</th></tr></thead>`;
let RIDX = null; const govName = rid => (RIDX ||= Object.fromEntries(REC.map(r => [r.rid, r])))[rid]?.name || rid;

function toCSV(rows){
  const cols = ["id","n","ec","status","obl","exp","gap","p","risk","why","last"];
  const head = ["project_id","project_name","expenditure_category","completion_status","obligated_usd","spent_usd","unspent_usd","stall_probability","projected_unspent_dec31_usd","top_risk_drivers","last_report"];
  const q = v => { v = Array.isArray(v) ? v.join("; ") : String(v ?? ""); return /[",\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; };
  return head.join(",") + "\n" + rows.map(r => cols.map(c => q(r[c])).join(",")).join("\n");
}
function download(name, text){ const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([text], {type: "text/csv"})); a.download = name; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 2000); }

function searchBox(){
  return `<div class="search"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
    <input id="q" placeholder="Find a city, county or state (e.g. Shelby County, Newark, Georgia)" autocomplete="off" aria-label="Search governments"><div class="sugg" id="sugg"></div></div>`;
}
function wireSearch(){
  const q = $("#q"), box = $("#sugg"); let sel = -1, hits = [];
  const stateNames = [...new Set(REC.map(r => r.st))];
  const draw = () => { box.innerHTML = hits.map((h, i) => `<a href="${h.href}" class="${i === sel ? "sel" : ""}"><span>${esc(h.name)}</span><small>${esc(h.meta)}</small></a>`).join(""); box.style.display = hits.length ? "block" : "none"; };
  q.oninput = () => { const t = q.value.trim().toLowerCase(); sel = -1;
    if (t.length < 2) { hits = []; return draw(); }
    const st = stateNames.filter(s => s.toLowerCase().includes(t)).slice(0, 2).map(s => ({name: s + " (all governments)", meta: "state", href: "#/s/" + slug(s)}));
    const words = t.split(/\s+/);
    const gov = REC.filter(r => words.every(w => r.name.toLowerCase().includes(w))).slice(0, 8).map(r => ({name: r.name, meta: usd(r.risk) + " at risk", href: "#/r/" + r.rid}));
    hits = [...st, ...gov]; draw(); };
  q.onkeydown = e => { if (e.key === "ArrowDown") { sel = Math.min(hits.length - 1, sel + 1); draw(); e.preventDefault(); }
    else if (e.key === "ArrowUp") { sel = Math.max(0, sel - 1); draw(); e.preventDefault(); }
    else if (e.key === "Enter" && hits.length) { location.hash = hits[Math.max(0, sel)].href; } };
  document.addEventListener("click", e => { if (!e.target.closest(".search")) box.style.display = "none"; });
}

// ---------- views ----------
function viewHome(){
  const n = NAT.national, best = NAT.evaluation[NAT.evaluation.length - 1];
  const [lo, hi] = n.at_risk_90ci_usd;
  $("#app").innerHTML = `
  <div class="eyebrow">ARPA State and Local Fiscal Recovery Funds &middot; spending deadline Dec 31, 2026</div>
  <h1>${usd(n.at_risk_usd)} of pandemic relief is on track to go unspent.</h1>
  <p class="lede">Every dollar a government has not spent by December 31, 2026 goes back to the U.S. Treasury. Stall Radar scores all ${n.open_projects.toLocaleString()} projects that still had money left on March 31, 2026, so finance teams know which ones to rescue first, while there is still time.</p>
  ${searchBox()}
  <div class="chips">${["Shelby County","Newark","State Of Georgia","Detroit","Cook County","Los Angeles"].map(c => `<a class="chip" href="#" data-q="${c}">${c}</a>`).join("")}</div>
  <section class="grid g3">
    <div class="card stat"><div class="v">${usd(n.open_gap_usd)}</div><div class="l">obligated but not yet spent on Mar 31, 2026</div><div class="s">${n.open_projects.toLocaleString()} projects at ${n.recipients_with_open_projects.toLocaleString()} governments</div></div>
    <div class="card stat"><div class="v risk">${usd(n.at_risk_usd)}</div><div class="l">projected still unspent at the deadline</div><div class="s">90% band ${usd(lo)} to ${usd(hi)}, drift-corrected</div></div>
    <div class="card stat"><div class="v">${best.auc_stall_dollar_weighted.toFixed(2)}</div><div class="l">dollar-weighted AUC on a year the model never saw</div><div class="s">trained on 2024-25 outcomes, tested on 2025-26</div></div>
  </section>
  <section class="grid g2">
    <div class="card"><h2>Where the stuck money is</h2><p class="sub">Projected unspent at the deadline, top 15 states and territories. Click a bar to open the state.</p><div id="cs"></div></div>
    <div class="card"><h2>What kind of spending stalls</h2><p class="sub">Projected unspent by Treasury expenditure category. Infrastructure is half the risk.</p><div id="cc"></div></div>
  </section>
  <section><div class="row"><div><h2>The 25 biggest rescue targets</h2><p class="sub">Projects with the most money projected to remain unspent. Tags show why the model flags each one.</p></div></div>
    <div class="tbl proj"><table>${projHead}<tbody>${projectRows(NAT.top_projects, true)}</tbody></table></div></section>`;
  hbar($("#cs"), NAT.by_state.slice(0, 15), {label: r => r.st, value: r => r.risk, sub: r => `${usd(r.risk)} projected unspent<br>of ${usd(r.gap)} open across ${r.n.toLocaleString()} projects`, href: r => "#/s/" + r.slug});
  hbar($("#cc"), NAT.by_category.filter(c => c.risk > 2e7), {label: r => r.label, value: r => r.risk, sub: r => `${usd(r.risk)} projected unspent<br>of ${usd(r.gap)} open, ${r.n.toLocaleString()} projects`});
  wireSearch();
  document.querySelectorAll(".chip[data-q]").forEach(c => c.onclick = e => { e.preventDefault(); const q = $("#q"); q.value = c.dataset.q; q.oninput(); q.focus(); });
}

async function viewRecipient(rid){
  const r = REC.find(x => x.rid === rid); if (!r) { $("#app").innerHTML = `<p class="loading">No open projects found for ${esc(rid)}.</p>`; return; }
  $("#app").innerHTML = `<div class="loading">Loading ${esc(r.name)}...</div>`;
  const list = (await state(slug(r.st))).filter(p => p.rid === rid);
  const shareTxt = r.share >= .5 ? "Most of this government's open balance is projected to be left on the table." : r.share >= .3 ? "A meaningful share of the open balance is at risk." : "Most open money is on pace, but the flagged projects still need attention.";
  $("#app").innerHTML = `
  <div class="eyebrow"><a href="#/s/${slug(r.st)}">${esc(r.st)}</a> &middot; ${esc(r.type)} &middot; Tier ${esc(r.tier)} reporter</div>
  <h1>${esc(r.name)}</h1>
  <p class="lede">${shareTxt} Figures are as of the March 31, 2026 Treasury report; the deadline to spend is December 31, 2026.</p>
  <section class="grid g3">
    <div class="card stat"><div class="v">${usd(r.gap)}</div><div class="l">obligated, not yet spent</div><div class="s">${r.open} open project${r.open === 1 ? "" : "s"}</div></div>
    <div class="card stat"><div class="v risk">${usd(r.risk)}</div><div class="l">projected unspent at the deadline</div><div class="s">${pct(r.share)} of the open balance</div></div>
    <div class="card stat"><div class="v">${list.length ? pct(Math.max(...list.map(p => p.p))) : "n/a"}</div><div class="l">highest single-project stall risk</div><div class="s">probability of spending less than half its remaining balance</div></div>
  </section>
  <section><div class="row"><div><h2>Closeout worklist</h2><p class="sub">Sorted by projected unspent dollars. Work from the top.</p></div><span class="spacer"></span><button class="btn primary" id="dl">Download worklist (CSV)</button></div>
  <div class="tbl proj"><table>${projHead}<tbody>${projectRows(list, false)}</tbody></table></div></section>
  <p class="note" style="margin-top:14px">Stall risk is the model's probability that a project spends less than half of its remaining balance before the deadline. Tags are the three features pushing hardest toward a stall for that project (exact TreeSHAP contributions).</p>`;
  $("#dl").onclick = () => download(slug(r.name) + "-arpa-worklist.csv", toCSV(list));
}

async function viewState(sl){
  const st = NAT.by_state.find(s => s.slug === sl); if (!st) { location.hash = "#/"; return; }
  const recs = REC.filter(r => slug(r.st) === sl);
  $("#app").innerHTML = `<div class="loading">Loading ${esc(st.st)}...</div>`;
  const list = await state(sl);
  $("#app").innerHTML = `
  <div class="eyebrow">State view</div><h1>${esc(st.st)}</h1>
  <p class="lede">${usd(st.gap)} still open across ${st.n.toLocaleString()} projects at ${recs.length.toLocaleString()} governments. ${usd(st.risk)} is projected to remain unspent on December 31, 2026.</p>
  <section class="grid g2">
    <div class="card"><h2>Governments with the most at risk</h2><p class="sub">Click a bar for its closeout worklist.</p><div id="cr"></div></div>
    <div class="card"><h2>Top projects</h2><p class="sub">Largest projected unspent balances in ${esc(st.st)}.</p><div id="cp"></div></div>
  </section>
  <section><div class="row"><h2>All governments</h2><span class="spacer"></span><button class="btn" id="dl">Download all ${list.length.toLocaleString()} projects (CSV)</button></div>
  <div class="tbl" style="margin-top:10px"><table><thead><tr><th>Government</th><th>Type</th><th class="num">Open projects</th><th class="num">Unspent now</th><th class="num">Projected unspent Dec 31</th></tr></thead><tbody>
  ${recs.map(r => `<tr><td><a href="#/r/${r.rid}">${esc(r.name)}</a></td><td>${esc(r.type)}</td><td class="num">${r.open}</td><td class="num">${usd(r.gap)}</td><td class="num"><b>${usd(r.risk)}</b></td></tr>`).join("")}</tbody></table></div></section>`;
  hbar($("#cr"), recs.slice(0, 12), {label: r => r.name.replace(/, [A-Za-z ]+$/, ""), value: r => r.risk, sub: r => `${usd(r.risk)} projected unspent of ${usd(r.gap)} open`, href: r => "#/r/" + r.rid});
  hbar($("#cp"), list.slice(0, 12), {label: p => p.n, value: p => p.risk, sub: p => `${esc(govName(p.rid))}<br>${usd(p.risk)} projected unspent, stall risk ${pct(p.p)}`, href: p => "#/r/" + p.rid});
  $("#dl").onclick = () => download(sl + "-arpa-open-projects.csv", toCSV(list));
}

function viewMethod(){
  const ev = NAT.evaluation, n = NAT.national;
  $("#app").innerHTML = `<div class="method">
  <div class="eyebrow">Method &amp; validation</div><h1>How the forecast is built, and how we know it works.</h1>
  <p class="lede">The only honest test of a deadline forecast is a deadline it has not seen. Stall Radar is fitted on one year of real outcomes and graded on the next.</p>
  <h2>The problem</h2>
  <p>The American Rescue Plan Act sent $350 billion to state, local, territorial and tribal governments through the State and Local Fiscal Recovery Funds (SLFRF). Money had to be obligated by December 31, 2024 and must be spent by December 31, 2026. Anything unspent is returned to Treasury. On March 31, 2026, ${usd(n.open_gap_usd)} of obligated money was still unspent across ${n.open_projects.toLocaleString()} projects. Finance directors have nine months, limited staff, and no way to tell which projects are actually stuck.</p>
  <h2>Data</h2>
  <p>Seven public Treasury SLFRF Project and Expenditure releases (data through Mar 2023, Dec 2023, Mar 2024, Dec 2024, Mar 2025, Dec 2025 and Mar 2026), about 900,000 project-snapshot rows in total. Project IDs are stable across releases, so each project can be followed over time. Larger governments report quarterly, smaller ones annually.</p>
  <h2>Target</h2>
  <p>For every project with more than $1,000 obligated but unspent at a snapshot, the target is the share of that unspent balance actually spent over the next twelve months, read from the next March report. Projects whose next report was not filed are excluded from training rather than counted as stalls. A project "stalls" when it spends less than half its remaining balance.</p>
  <h2>Features (all knowable at the snapshot date)</h2>
  <ul><li><b>Pace:</b> share of the open balance spent in the prior twelve months and, for quarterly reporters, the prior quarter.</li>
  <li><b>Position:</b> budget, unspent balance, share spent, completion status and how it changed, late budget revisions.</li>
  <li><b>Context:</b> the government's overall spend rate and pace, number of open projects, this project's share of the government's open money, tier, government type, state.</li>
  <li><b>What it is:</b> Treasury expenditure category, capital project flags and cost, and a TF-IDF ridge model over the project name and description, stacked in as an out-of-fold score.</li></ul>
  <h2>Model</h2>
  <p>A LightGBM gradient-boosted tree model with a cross-entropy objective on the spent share (so it predicts an expected share between 0 and 1), lightly weighted by dollar size. Per-project explanations are LightGBM's exact TreeSHAP contributions. The production model is refitted on both labelled years and scores the March 2026 book. Because nine months remain, the twelve-month forecast is converted with a constant-hazard assumption: share by deadline = 1 - (1 - twelve-month share)<sup>0.75</sup>.</p>
  <h2>Out-of-time validation</h2>
  <p>Fitted on ${NAT.n_train.toLocaleString()} projects (Mar 2024 to Mar 2025 outcomes). Graded on ${NAT.n_test.toLocaleString()} projects (Mar 2025 to Mar 2026 outcomes), a year the model never saw, after the obligation deadline had passed.</p>
  <div class="tbl"><table><thead><tr><th>Model</th><th class="num">AUC (stall)</th><th class="num">AUC, dollar-weighted</th><th class="num">Avg precision</th><th class="num">Brier</th><th class="num">MAE (share)</th><th class="num">Unspent: predicted vs actual</th></tr></thead><tbody>
  ${ev.map((r, i) => `<tr class="${i === ev.length - 1 ? "best" : ""}"><td>${esc(r.model)}</td><td class="num">${r.auc_stall.toFixed(3)}</td><td class="num">${r.auc_stall_dollar_weighted.toFixed(3)}</td><td class="num">${r.ap_stall.toFixed(3)}</td><td class="num">${r.brier_stall.toFixed(3)}</td><td class="num">${r.mae_closure.toFixed(3)}</td><td class="num">${usd(r.predicted_unspent_B * 1e9)} vs ${usd(r.actual_unspent_B * 1e9)}</td></tr>`).join("")}
  </tbody></table></div>
  <p class="note">"Persistence" assumes each project keeps last year's pace. "Base rate" predicts the average. Stall Radar beats both on every ranking metric. Text alone is weak, and adding it to the tree model changes AUC by ${(ev[4].auc_stall - ev[3].auc_stall >= 0 ? "+" : "") + (ev[4].auc_stall - ev[3].auc_stall).toFixed(3)} and dollar-weighted AUC by ${(ev[4].auc_stall_dollar_weighted - ev[3].auc_stall_dollar_weighted >= 0 ? "+" : "") + (ev[4].auc_stall_dollar_weighted - ev[3].auc_stall_dollar_weighted).toFixed(3)}. We keep it for the per-project explanations it enables and report the ablation rather than hide it.</p>
  <section class="grid g2">
    <div class="card"><h3>Calibration on the held-out year</h3><p class="sub">Each dot is a tenth of projects. The dashed line is perfect calibration.</p><div id="cal"></div></div>
    <div class="card"><h3>What the model leans on</h3><p class="sub">Share of total split gain, production model.</p><div id="imp"></div></div>
  </section>
  <h2>The drift we found, and how the forecast handles it</h2>
  <p>On the held-out year the model predicted ${usd(ev[ev.length - 1].predicted_unspent_B * 1e9)} would stay unspent; the true figure was ${usd(ev[ev.length - 1].actual_unspent_B * 1e9)}. Spending speeds up as the deadline nears, and the calibration curve shows it: the projects the model rated slowest spent faster than predicted. The ranking held up; the level drifted. We carry the measured drift into the headline number as a correction factor of ${n.drift_correction.toFixed(3)} (bootstrapped over held-out projects, 500 resamples), which gives ${usd(n.at_risk_usd)} with a 90% band of ${usd(n.at_risk_90ci_usd[0])} to ${usd(n.at_risk_90ci_usd[1])}. If the final quarter accelerates harder than 2025 did, the true figure will be lower. The ranking is the product; the national total is a planning estimate.</p>
  <h2>Accuracy by slice (held-out year)</h2>
  <div class="tbl"><table><thead><tr><th>Slice</th><th class="num">Projects</th><th class="num">AUC</th><th class="num">Actual share spent</th><th class="num">Predicted</th></tr></thead><tbody>
  ${NAT.slices.map(s => `<tr><td>${esc(s.slice.replace("tier=", "Tier ").replace("rtype=", "").replace("ec_group=", "Expenditure group "))}</td><td class="num">${s.n.toLocaleString()}</td><td class="num">${s.auc.toFixed(3)}</td><td class="num">${pct(s.actual_closure)}</td><td class="num">${pct(s.pred_closure)}</td></tr>`).join("")}
  </tbody></table></div>
  <h2>Responsible use and limits</h2>
  <ul><li>Every input is public, government-level data. No personal data is used.</li>
  <li>A high stall risk is a reason to check, not a finding of waste or non-compliance. Some "unspent" balances are spent but not yet reported, and Treasury allows certain adjustments.</li>
  <li>Smaller governments report once a year, so their pace is measured less precisely (Tier 5 AUC is the lowest slice).</li>
  <li>State is a strong feature. It captures real differences in state pass-through programs and reporting habits, but it also means a government is partly judged by its neighbors; the worklist tags show when that is the main reason.</li>
  <li>Reproduce everything with <span class="kbd">python pipeline/01_ingest.py</span> through <span class="kbd">04_export.py</span>; the raw Treasury files are downloaded by <span class="kbd">pipeline/00_download.py</span>.</li></ul>
  </div>`;
  calibChart($("#cal"), NAT.calibration);
  hbar($("#imp"), NAT.importance.slice(0, 10), {label: r => r.f, value: r => r.v, fmt: v => (v * 100).toFixed(1) + "%"});
}

  <section class="grid g2">
   <div class="card"><h3>National open book</h3><p class="sub">All ${NAT.national.open_projects.toLocaleString()} scored projects, one file per state.</p><a class="btn" href="data/recipients.json">Governments (JSON)</a> <a class="btn" href="data/national.json">Summary &amp; validation (JSON)</a></div>
   <div class="card"><h3>Presentation</h3><p class="sub">The DataNova 2026 deck: problem, method, validation, impact.</p><a class="btn primary" href="StallRadar-DataNova2026.pptx">Download deck (PPTX)</a></div>
  </section>
  <h2>Sources</h2><ul><li>U.S. Department of the Treasury, SLFRF Project and Expenditure public data releases, April 2023 through August 2026 (home.treasury.gov, State and Local Fiscal Recovery Funds, Public Data).</li></ul>

async function route(){
  const h = location.hash.replace(/^#\/?/, "");
  document.querySelectorAll("nav a").forEach(a => a.classList.toggle("on", (a.dataset.r === "home" && (!h || h.startsWith("r/") || h.startsWith("s/"))) || (h && a.dataset.r === h.split("/")[0])));
  window.scrollTo(0, 0);
  try {
    if (h.startsWith("r/")) await viewRecipient(decodeURIComponent(h.slice(2)));
    else if (h.startsWith("s/")) await viewState(h.slice(2));
    else if (h === "method") viewMethod();
    else if (h === "data") viewData();
    else viewHome();
  } catch (e) { $("#app").innerHTML = `<p class="loading">Something went wrong loading data: ${esc(e.message)}</p>`; }
}
(async () => { [NAT, REC] = await Promise.all([getJSON("data/national.json"), getJSON("data/recipients.json")]); addEventListener("hashchange", route); route(); })();
</script>
